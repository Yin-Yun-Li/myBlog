<script>
  (function() {
    const savedTheme = localStorage.getItem("quarto-color-scheme");
    const isDark = savedTheme === "alternate";

    // 先鋪上與網站一致的夜讀／紙張底色，避免主題切換時閃白。
    document.documentElement.style.backgroundColor = isDark ? "#171d1b" : "#f7f3e9";

    // 注入臨時 CSS 鎖定初期顏色，不等 styles.css 下載完就生效。
    const style = document.createElement('style');
    style.innerHTML = `
      html, body {
        background-color: ${isDark ? "#171d1b" : "#f7f3e9"} !important;
        transition: none !important;
      }
    `;
    document.head.appendChild(style);
  })();
</script>
